{% extends "base.html" %}

{% block title %}Adicionar Curso - Core Study{% endblock %}

{% block header %}
<header class="page-header">
    <div class="page-header-left" style="display: flex; align-items: center; gap: 15px;">
        <button id="toggle-sidebar" class="toggle-sidebar-btn" aria-label="Recolher Menu">☰</button>
        <div>
            <h1>Adicionar Curso</h1>
            <p>Cadastre as informações base de um novo curso.</p>
        </div>
    </div>
    <div>
        <a href="/admin/cursos" class="btn-secondary">Voltar para Cursos</a>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST">
        <div class="form-group">
            <label for="titulo">Título do Curso</label>
            <input id="titulo" type="text" name="titulo" placeholder="Ex: Python para Iniciantes" required>
        </div>
        
        <div class="form-group">
            <label for="categoria_id">Categoria</label>
            <select id="categoria_id" name="categoria_id" required>
                <option value="">Selecione uma categoria...</option>
                {% for cat in categorias %}
                    <option value="{{ cat[0] }}">{{ cat[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="carga_hora">Carga Horária (Horas)</label>
            <input id="carga_hora" type="number" name="carga_hora" placeholder="Ex: 40" required min="1">
        </div>

        <div class="form-group">
            <label for="descricao">Descrição do Curso</label>
            <input id="descricao" type="text" name="descricao" placeholder="Escreva um breve resumo sobre o que será ensinado..." required style="height: 80px;">
        </div>
        
        <div class="btn-block" style="flex-direction: row; margin-top: 30px;">
            <button type="submit" class="btn-primary" style="width: auto;">Salvar Curso</button>
            <a href="/admin/cursos" class="btn-secondary" style="width: auto; text-align: center; padding: 10px 18px;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
