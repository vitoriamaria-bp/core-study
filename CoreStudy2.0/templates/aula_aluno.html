<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ aula[1] }} - Core Study</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; color: #1e293b; }
        .classroom-header { background: #fff; padding: 15px 40px; border-bottom: 2px solid #e2e8f0; display: flex; align-items: center; gap: 20px; }
        .btn-voltar { color: #e67e22; text-decoration: none; font-weight: 700; font-size: 14px; }
        
        .classroom-main { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 320px; gap: 30px; }
        
        /* Correção do Player: Mantém proporção e evita cortes */
        .video-container { background: #000; border-radius: 12px; overflow: hidden; width: 100%; aspect-ratio: 16/9; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        
        .material-box { background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 20px; }
        .material-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f8fafc; border-radius: 8px; margin-top: 10px; border: 1px solid #e2e8f0; }
        
        .sidebar { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; height: fit-content; }
        .sidebar h3 { font-size: 16px; margin-top: 0; color: #0f172a; }
        .aula-link { display: block; padding: 10px; color: #475569; text-decoration: none; font-size: 14px; border-radius: 6px; margin-bottom: 5px; transition: 0.2s; }
        .aula-link:hover { background: #fff3eb; color: #e67e22; font-weight: 600; }
        .aula-link.active { background: #e67e22; color: #fff; }
    </style>
</head>
<body>

    <header class="classroom-header">
        <a href="javascript:history.back()" class="btn-voltar">← Voltar</a>
        <h2 style="margin:0; font-size: 18px;">{{ aula[1] }}</h2>
    </header>

    <main class="classroom-main">
        <section>
            <div class="video-container">
                <iframe src="{{ aula[2] }}" allowfullscreen></iframe>
            </div>

            <div class="material-box">
                <h3 style="margin-top:0;">Materiais de Apoio</h3>
                {% for mat in materiais %}
                <div class="material-item">
                    <span>📄</span>
                    <div>
                        <strong>{{ mat[1] }}</strong><br>
                        <small style="color: #64748b;">Disponível para download</small>
                    </div>
                </div>
                {% else %}
                <p style="color: #64748b; font-size: 14px;">Nenhum material disponível para esta aula.</p>
                {% endfor %}
            </div>
        </section>

        <aside class="sidebar">
            <h3>Conteúdo do Módulo</h3>
            {% for outra_aula in todas_aulas_modulo %}
            <a href="/trilha/aula/{{ outra_aula[0] }}" class="aula-link {% if outra_aula[0] == aula[0] %}active{% endif %}">
                {{ outra_aula[1] }}
            </a>
            {% endfor %}
        </aside>
    </main>

</body>
</html>
