{% extends "base.html" %}

{% block title %}Adicionar Categoria - Core Study{% endblock %}

{% block header %}
<header class="page-header">
    <div class="page-header-left" style="display: flex; align-items: center; gap: 15px;">
        <button id="toggle-sidebar" class="toggle-sidebar-btn" aria-label="Recolher Menu">☰</button>
        <div>
            <h1>Adicionar Categoria</h1>
            <p>Cadastre uma nova área de estudo no sistema.</p>
        </div>
    </div>
    <div>
        <a href="/admin/categorias" class="btn-secondary">Voltar para Categorias</a>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="content-card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST">
        <div class="form-group">
            <label for="nome_categoria">Nome da Categoria</label>
            <input id="nome_categoria" type="text" name="nome_categoria" placeholder="Ex: Programação Front-end" required>
        </div>
        
        <div class="btn-block" style="flex-direction: row; margin-top: 30px;">
            <button type="submit" class="btn-primary" style="width: auto;">Salvar Categoria</button>
            <a href="/admin/categorias" class="btn-secondary" style="width: auto; text-align: center; padding: 10px 18px;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
