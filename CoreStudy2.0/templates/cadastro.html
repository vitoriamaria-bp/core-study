<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Core Study</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page home-page">

    <main class="auth-card home-card">
        <img src="{{ url_for('static', filename='img/logo_core_study.png') }}" alt="Logo Core Study" class="logo">

        <h1>Cadastro</h1>
        <p>Crie sua conta para acessar trilhas, aulas e materiais de estudo.</p>

        <form method="POST">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input id="nome" type="text" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="Digite seu email" required data-email-validation data-email-feedback="email-feedback">
                <div id="email-feedback" class="field-feedback" aria-live="polite"></div>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <div class="phone-row" data-phone-field>
                    <select data-phone-country aria-label="Codigo do pais">
                        <option value="+55">+55 BR</option>
                        <option value="+1">+1 EUA</option>
                        <option value="+351">+351 PT</option>
                        <option value="+34">+34 ES</option>
                        <option value="+44">+44 UK</option>
                    </select>
                    <input id="telefone_numero" type="text" name="telefone_numero" placeholder="(11) 99898-4848" required data-phone-number>
                    <input id="telefone" type="hidden" name="telefone" data-phone-full>
                </div>
            </div>

            <div class="form-group">
                <label for="data_nasc">Data de nascimento</label>
                <input id="data_nasc" type="date" name="data_nasc" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input id="senha" type="password" name="senha" placeholder="Digite sua senha" required>
            </div>

            <div class="button-row">
                <button type="submit">Cadastrar</button>
                <a href="/" class="btn-secondary">Voltar</a>
            </div>
        </form>
    </main>

    <script src="{{ url_for('static', filename='email-validation.js') }}"></script>
    <script src="{{ url_for('static', filename='phone-format.js') }}"></script>
</body>
</html>
