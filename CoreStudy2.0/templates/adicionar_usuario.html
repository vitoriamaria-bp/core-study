<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Usuário</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <img src="{{ url_for('static', filename='img/logo_core_study.png') }}" alt="Logo Core Study" class="logo">

    <h1>Adicionar Usuário</h1>

    <form method="POST">
        <input type="text" name="nome" placeholder="Nome" required>
        <br><br>

        <input id="email" type="email" name="email" placeholder="Email" required data-email-validation data-email-feedback="email-feedback">
        <div id="email-feedback" class="field-feedback" aria-live="polite"></div>
        <br><br>

        <div class="phone-row" data-phone-field>
            <select data-phone-country aria-label="Codigo do pais">
                <option value="+55">+55 BR</option>
                <option value="+1">+1 EUA</option>
                <option value="+351">+351 PT</option>
                <option value="+34">+34 ES</option>
                <option value="+44">+44 UK</option>
            </select>
            <input type="text" name="telefone_numero" placeholder="(11) 99898-4848" required data-phone-number>
            <input type="hidden" name="telefone" data-phone-full>
        </div>
        <br><br>

        <input type="date" name="data_nasc" required>
        <br><br>

        <input type="password" name="senha" placeholder="Senha" required>
        <br><br>

        <button type="submit">Cadastrar</button>

        <br><br>

        <a href="/admin/usuarios">Voltar</a>
    </form>

    <script src="{{ url_for('static', filename='email-validation.js') }}"></script>
    <script src="{{ url_for('static', filename='phone-format.js') }}"></script>
</body>
</html>
